name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Checks (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Add linting or tests here if available
    # - name: Lint with Ruff
    #   run: ruff check .

  frontend:
    name: Frontend Checks (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: fe/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build
      run: npm run build
